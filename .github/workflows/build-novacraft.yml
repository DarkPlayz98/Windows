name: NovaCraft Android APK (Zalith Engine + Bento UI)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-novacraft.yml"
      - "patches/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out NovaCraft repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Clone Zalith Launcher 2 Engine
        run: |
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

          git clone --depth 1 https://github.com/ZalithLauncher/ZalithLauncher2.git launcher
          cd launcher

          find . -name ".gitmodules" -exec sed -i 's#git@github.com:#https://github.com/#g' {} +
          find . -name ".gitmodules" -exec sed -i 's#ssh://git@github.com/#https://github.com/#g' {} +

          git submodule init
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Inject Custom Bento UI, Bedrock Auth & Phonk Assets
        working-directory: launcher
        run: |
          mkdir -p ZalithLauncher/src/main/java/net/kdt/pojavlaunch
          cp ../patches/NovaBentoActivity.kt ZalithLauncher/src/main/java/net/kdt/pojavlaunch/NovaBentoActivity.kt
          python3 ../patches/apply_nova_bento.py

      - name: Build NovaLauncher Debug APK
        working-directory: launcher
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :ZalithLauncher:assembleDebug -Darch=arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCraft-debug-apk
          path: launcher/ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
