name: NovaCraft Android APK (Zalith Engine + Bento UI)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-novacraft.yml"
      - "patches/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out NovaCraft repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone Zalith Launcher 2 Engine
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git clone --depth 1 https://github.com/ZalithLauncher/ZalithLauncher2.git launcher
          cd launcher
          find . -name ".gitmodules" -exec sed -i 's#git@github.com:#https://github.com/#g' {} +
          git submodule update --init --recursive

      - name: Inject Custom Bento UI & Phonk Assets
        working-directory: launcher
        run: |
          # Copy our custom Kotlin Bento UI into Zalith's source tree
          mkdir -p app/src/main/java/net/kdt/pojavlaunch
          cp ../patches/NovaBentoActivity.kt app/src/main/java/net/kdt/pojavlaunch/NovaBentoActivity.kt
          
          # Run the Python patcher to reroute the app launch and download real Phonk MP3s
          python3 ../patches/apply_nova_bento.py

      - name: Build NovaLauncher (Debug APK)
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaLauncher-Bento-Zalith
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
