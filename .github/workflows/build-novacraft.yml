name: NovaCraft Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-novacraft.yml"
      - "patches/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out NovaCraft repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          packages: "platform-tools"

      - name: Install Android SDK, NDK, ffmpeg & yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 python3-pip ffmpeg
          python3 -m pip install --upgrade yt-dlp || true
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Clone ZalithLauncher2 engine & submodules
        run: |
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

          git clone --depth 1 --recurse-submodules https://github.com/ZalithLauncher/ZalithLauncher2.git launcher
          cd launcher
          git submodule update --init --recursive

      - name: Apply NovaLauncher Branding, Unlocks & Assets
        working-directory: launcher
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          python3 ../patches/apply_novalauncher.py

      - name: Build NovaLauncher Debug APK (ARM64)
        working-directory: launcher
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          OAUTH_CLIENT_ID: "00000000402b5328"
          CURSEFORGE_API_KEY: "$2a$10$bL4bIL5pUWqfcO7KQtnMReakwtfHbNKh6v1uTpKlzhwoueEJQnPnm"
        run: |
          ./gradlew --no-daemon :ZalithLauncher:assembleDebug -Darch=arm64
          for apk in ZalithLauncher/build/outputs/apk/debug/*.apk; do
            if [ -f "$apk" ] && [ "$(basename "$apk")" != "NovaLauncher-debug.apk" ]; then
              cp "$apk" "ZalithLauncher/build/outputs/apk/debug/NovaLauncher-debug.apk"
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCraft-debug-apk
          path: launcher/ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
