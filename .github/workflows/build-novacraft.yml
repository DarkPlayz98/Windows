name: NovaCraft Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-novacraft.yml"
      - "patches/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out NovaCraft repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          packages: "platform-tools"

      - name: Install Android SDK, NDK, ffmpeg & yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 python3-pip ffmpeg
          python3 -m pip install --upgrade yt-dlp || true
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Clone upstream source & submodules
        run: |
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

          git clone --branch v3_openjdk --depth 1 https://github.com/AngelAuraMC/Amethyst-Android.git launcher
          cd launcher

          sed -i 's#git@github.com:#https://github.com/#g' .gitmodules
          sed -i 's#ssh://git@github.com/#https://github.com/#g' .gitmodules

          git submodule init
          git submodule sync --recursive
          git submodule update --init --recursive

          find . -name ".gitmodules" -exec sed -i 's#git@github.com:#https://github.com/#g' {} +
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Run upstream language script & apply NovaLauncher patches
        working-directory: launcher
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          if [ -f scripts/languagelist_updater.sh ]; then
            chmod +x scripts/languagelist_updater.sh
            bash scripts/languagelist_updater.sh
          fi
          cp ../patches/NovaModMenu.java app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/NovaModMenu.java
          python3 ../patches/apply_novalauncher.py

      - name: Build GLFW stub
        working-directory: launcher
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          ./gradlew --no-daemon :jre_lwjgl3glfw:build

      - name: Build NovaLauncher debug APK
        working-directory: launcher
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          ./gradlew --no-daemon :app_pojavlauncher:assembleDebug
          for apk in app_pojavlauncher/build/outputs/apk/debug/*.apk; do
            if [ -f "$apk" ] && [ "$(basename "$apk")" != "NovaLauncher-debug.apk" ]; then
              mv "$apk" "app_pojavlauncher/build/outputs/apk/debug/NovaLauncher-debug.apk"
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCraft-debug-apk
          path: launcher/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
