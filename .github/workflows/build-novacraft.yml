name: NovaCraft Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-novacraft.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out NovaCraft build configuration
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1" || \
          sdkmanager --channel=3 --install \
            "platforms;android-37.0"

          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Verify Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed
          ls -la "$ANDROID_HOME/platforms"

      - name: Download launcher source
        run: |
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

          git clone --branch v3_openjdk --depth 1 https://github.com/AngelAuraMC/Amethyst-Android.git launcher
          cd launcher

          # Rewrite all SSH GitHub URLs in .gitmodules to HTTPS before initializing submodules
          sed -i 's#git@github.com:#https://github.com/#g' .gitmodules
          sed -i 's#ssh://git@github.com/#https://github.com/#g' .gitmodules
          cat .gitmodules

          git submodule init
          git submodule sync --recursive
          git submodule update --init --recursive

          # Patch any nested .gitmodules just in case
          find . -name ".gitmodules" -exec sed -i 's#git@github.com:#https://github.com/#g' {} +
          git submodule sync --recursive
          git submodule update --init --recursive

          grep -rn "Sdk" app_pojavlauncher/build.gradle || true

      - name: Prepare launcher pre-build assets
        working-directory: launcher
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          if [ -f scripts/languagelist_updater.sh ]; then
            chmod +x scripts/languagelist_updater.sh
            bash scripts/languagelist_updater.sh
          fi
          ./gradlew --no-daemon :jre_lwjgl3glfw:build

      - name: Build debug APK
        working-directory: launcher
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          ./gradlew --no-daemon :app_pojavlauncher:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCraft-debug-apk
          path: launcher/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
