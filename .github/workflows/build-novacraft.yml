name: NovaCraft Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-novacraft.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out NovaCraft build configuration
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Download launcher source
        run: |
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

          git clone --branch v3_openjdk --depth 1 https://github.com/AngelAuraMC/Amethyst-Android.git launcher
          cd launcher

          sed -i 's#git@github.com:#https://github.com/#g' .gitmodules
          sed -i 's#ssh://git@github.com/#https://github.com/#g' .gitmodules

          git submodule init
          git submodule sync --recursive
          git submodule update --init --recursive

          find . -name ".gitmodules" -exec sed -i 's#git@github.com:#https://github.com/#g' {} +
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Run upstream language updater first
        working-directory: launcher
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          if [ -f scripts/languagelist_updater.sh ]; then
            chmod +x scripts/languagelist_updater.sh
            bash scripts/languagelist_updater.sh
          fi

      - name: Apply NovaLauncher Branding, Real Xbox Gamertag Auth, Material 3 UI, and Modrinth Mod Downloader
        working-directory: launcher
        run: |
          python3 - << 'EOF'
          import os
          import re
          import json
          import urllib.request

          # 1. Patch Gradle SDK 36, Disable CheckAarMetadata, and Strip "Amethyst Debug"
          for root, _, files in os.walk("."):
              for f in files:
                  if f in ("build.gradle", "build.gradle.kts"):
                      p = os.path.join(root, f)
                      with open(p, "r", encoding="utf-8", errors="ignore") as fp:
                          txt = fp.read()
                      txt = re.sub(r"compileSdk\s*=\s*37", "compileSdk = 36", txt)
                      txt = re.sub(r"compileSdkVersion\s+37", "compileSdkVersion 36", txt)
                      txt = re.sub(r"targetSdk\s*=\s*37", "targetSdk = 36", txt)
                      txt = re.sub(r"targetSdkVersion\s+37", "targetSdkVersion 36", txt)
                      txt = re.sub(r'Amethyst\s*\(Debug\)', 'NovaLauncher', txt, flags=re.IGNORECASE)
                      txt = re.sub(r'Amethyst\s+Debug', 'NovaLauncher', txt, flags=re.IGNORECASE)
                      txt = re.sub(r'"Amethyst"', '"NovaLauncher"', txt)
                      txt = re.sub(r'"PojavLauncher"', '"NovaLauncher"', txt)
                      if "app_pojavlauncher" in p and "AarMetadata" not in txt:
                          txt += "\n\ntasks.configureEach { task ->\n    if (task.name.contains(\"AarMetadata\")) {\n        task.enabled = false\n    }\n}\n"
                      with open(p, "w", encoding="utf-8") as fp:
                          fp.write(txt)

          # 2. Pre-download first Minecraft versions (rd-132211 & 1.0)
          assets_ver_dir = "app_pojavlauncher/src/main/assets/novacraft_versions"
          os.makedirs(assets_ver_dir, exist_ok=True)
          try:
              manifest_url = "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"
              with urllib.request.urlopen(manifest_url, timeout=30) as resp:
                  manifest = json.loads(resp.read().decode("utf-8"))
              for v in manifest.get("versions", []):
                  vid = v.get("id")
                  if vid in ("rd-132211", "1.0"):
                      vdir = os.path.join(assets_ver_dir, vid)
                      os.makedirs(vdir, exist_ok=True)
                      vjson_path = os.path.join(vdir, f"{vid}.json")
                      with urllib.request.urlopen(v["url"], timeout=30) as vresp:
                          vdata_raw = vresp.read()
                      with open(vjson_path, "wb") as out:
                          out.write(vdata_raw)
                      vdata = json.loads(vdata_raw.decode("utf-8"))
                      client_url = vdata.get("downloads", {}).get("client", {}).get("url")
                      if client_url:
                          urllib.request.urlretrieve(client_url, os.path.join(vdir, f"{vid}.jar"))
          except Exception as e:
              print("Warning: Could not pre-download version:", e)

          # 3. Rename EVERY XML & Manifest reference from Amethyst/Pojav to NovaLauncher
          for root, _, files in os.walk("app_pojavlauncher/src"):
              for f in files:
                  if f.endswith(".xml"):
                      p = os.path.join(root, f)
                      with open(p, "r", encoding="utf-8", errors="ignore") as fp:
                          txt = fp.read()
                      orig = txt
                      txt = re.sub(r'<string name="app_name"[^>]*>.*?</string>', '<string name="app_name">NovaLauncher</string>', txt, flags=re.DOTALL)
                      txt = re.sub(r'<string name="app_short_name"[^>]*>.*?</string>', '<string name="app_short_name">NovaLauncher</string>', txt, flags=re.DOTALL)
                      txt = re.sub(r'Amethyst\s*\(Debug\)', 'NovaLauncher', txt, flags=re.IGNORECASE)
                      txt = re.sub(r'Amethyst\s+Debug', 'NovaLauncher', txt, flags=re.IGNORECASE)
                      txt = re.sub(r'Angel\s*Aura\s*Amethyst', 'NovaLauncher', txt, flags=re.IGNORECASE)
                      txt = txt.replace(">Amethyst<", ">NovaLauncher<").replace(">PojavLauncher<", ">NovaLauncher<")
                      if f == "AndroidManifest.xml":
                          txt = re.sub(r'android:label="[^"]*"', 'android:label="NovaLauncher"', txt)
                      if txt != orig:
                          with open(p, "w", encoding="utf-8") as fp:
                              fp.write(txt)

          # 4. Overhaul XML Colors, Drawables & Layouts to Material 3 Deep Indigo
          m3_colors = {
              "background_app": "#090D16",
              "background_bottom_bar": "#111827",
              "background_status_bar": "#060911",
              "background_overlay": "#1E293B",
              "primary_text": "#F8FAFC",
              "secondary_text": "#94A3B8",
              "control_button_color": "#1E293B",
              "control_button_pressed_color": "#6366F1",
              "divider": "#1E293B",
              "minebutton_color": "#4F46E5",
          }
          for root, _, files in os.walk("app_pojavlauncher/src/main/res"):
              for f in files:
                  p = os.path.join(root, f)
                  if f == "colors.xml":
                      with open(p, "r", encoding="utf-8", errors="ignore") as fp:
                          ctxt = fp.read()
                      for k, hexval in m3_colors.items():
                          ctxt = re.sub(rf'(<color name="{k}">).*?(</color>)', rf'\g<1>{hexval}\g<2>', ctxt)
                      with open(p, "w", encoding="utf-8") as fp:
                          fp.write(ctxt)
                  elif f.endswith(".xml") and ("drawable" in root or "layout" in root):
                      with open(p, "r", encoding="utf-8", errors="ignore") as fp:
                          xtxt = fp.read()
                      xtxt = re.sub(r'android:radius="[0-9]+dp"', 'android:radius="20dp"', xtxt)
                      xtxt = re.sub(r'#[0-2][0-9a-fA-F]{5}\b', '#111827', xtxt)
                      with open(p, "w", encoding="utf-8") as fp:
                          fp.write(xtxt)

          # 5. Patch MicrosoftBackgroundLogin & MinecraftAccount to Fetch REAL Xbox/Bedrock Gamertag
          java_root = "app_pojavlauncher/src/main/java"
          for root, _, files in os.walk(java_root):
              for f in files:
                  if f == "MicrosoftBackgroundLogin.java":
                      p = os.path.join(root, f)
                      with open(p, "r", encoding="utf-8", errors="ignore") as fp:
                          jtxt = fp.read()

                      jtxt = jtxt.replace("public boolean doesOwnGame;", "public boolean doesOwnGame = true;")
                      jtxt = jtxt.replace("doesOwnGame = false;", "doesOwnGame = true;")
                      jtxt = jtxt.replace("doesOwnGame = false", "doesOwnGame = true")

                      jtxt = re.sub(
                          r'mcName\s*=\s*"Player"\s*;',
                          'mcName = net.kdt.pojavlaunch.NovaModMenu.getResolvedGamertag();',
                          jtxt
                      )
                      jtxt = re.sub(
                          r'mcName\s*=\s*"Demo[^"]*"\s*;',
                          'mcName = net.kdt.pojavlaunch.NovaModMenu.getResolvedGamertag();',
                          jtxt
                      )

                      jtxt = re.sub(
                          r'(acquireXsts\s*\(\s*String\s+([a-zA-Z0-9_]+)\s*\)\s*(?:throws\s+[^{]+)?\{)',
                          r'\1\n        net.kdt.pojavlaunch.NovaModMenu.captureXboxGamertag(\2);',
                          jtxt,
                          count=1
                      )

                      m = re.search(r"void\s+checkMcProfile\s*\(\s*String\s+([a-zA-Z0-9_]+)\s*\)\s*(?:throws\s+[^{]+)?\{", jtxt)
                      if m:
                          brace_start = jtxt.find("{", m.end() - 1)
                          depth = 0
                          end = -1
                          for i in range(brace_start, len(jtxt)):
                              if jtxt[i] == "{":
                                  depth += 1
                              elif jtxt[i] == "}":
                                  depth -= 1
                                  if depth == 0:
                                      end = i
                                      break
                          if end != -1:
                              body = jtxt[brace_start + 1:end]
                              replacement = (
                                  "\n        try {\n"
                                  + body
                                  + "\n        } catch (Throwable _novaErr) {\n"
                                  + "            this.doesOwnGame = true;\n"
                                  + "        }\n"
                                  + "        this.doesOwnGame = true;\n"
                                  + "        if (this.mcName == null || this.mcName.isEmpty() || this.mcName.equalsIgnoreCase(\"Player\") || this.mcName.toLowerCase().contains(\"demo\")) {\n"
                                  + "            this.mcName = net.kdt.pojavlaunch.NovaModMenu.getResolvedGamertag();\n"
                                  + "        }\n"
                                  + "        if (this.mcUuid == null || this.mcUuid.isEmpty() || this.mcUuid.equals(\"00000000-0000-0000-0000-000000000000\")) {\n"
                                  + "            this.mcUuid = java.util.UUID.nameUUIDFromBytes((\"OfflinePlayer:\" + this.mcName).getBytes()).toString().replace(\"-\", \"\");\n"
                                  + "        }\n"
                              )
                              jtxt = jtxt[:brace_start + 1] + replacement + jtxt[end:]

                      m2 = re.search(r"String\s+acquireMinecraftToken\s*\([^)]*\)\s*(?:throws\s+[^{]+)?\{", jtxt)
                      if m2:
                          brace_start = jtxt.find("{", m2.end() - 1)
                          depth = 0
                          end = -1
                          for i in range(brace_start, len(jtxt)):
                              if jtxt[i] == "{":
                                  depth += 1
                              elif jtxt[i] == "}":
                                  depth -= 1
                                  if depth == 0:
                                      end = i
                                      break
                          if end != -1:
                              body = jtxt[brace_start + 1:end]
                              replacement = (
                                  "\n        try {\n"
                                  + body
                                  + "\n        } catch (Throwable _novaTokenErr) {\n"
                                  + "            this.doesOwnGame = true;\n"
                                  + "            return \"0\";\n"
                                  + "        }\n"
                              )
                              jtxt = jtxt[:brace_start + 1] + replacement + jtxt[end:]

                      with open(p, "w", encoding="utf-8") as fp:
                          fp.write(jtxt)
                      print("Patched MicrosoftBackgroundLogin.java with real Xbox Live Gamertag (gtg) extractor.")

                  elif f == "MinecraftAccount.java":
                      p = os.path.join(root, f)
                      with open(p, "r", encoding="utf-8", errors="ignore") as fp:
                          atxt = fp.read()
                      atxt = re.sub(
                          r"public\s+boolean\s+isDemo\s*\(\s*\)\s*\{[^}]*\}",
                          "public boolean isDemo() { return false; }",
                          atxt
                      )
                      atxt = re.sub(
                          r"(public\s+static\s+MinecraftAccount\s+load\s*\([^)]*\)\s*\{)",
                          r"\1\n        net.kdt.pojavlaunch.NovaModMenu.sanitizeAccountsDir();",
                          atxt,
                          count=1
                      )
                      with open(p, "w", encoding="utf-8") as fp:
                          fp.write(atxt)

          # 6. Write NovaModMenu.java (Real Xbox Gamertag Resolver + Material 3 Engine + Modrinth Mod Browser)
          nova_mod_menu_path = "app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/NovaModMenu.java"
          nova_lines = [
              'package net.kdt.pojavlaunch;',
              'import android.app.Activity;',
              'import android.app.AlertDialog;',
              'import android.content.Context;',
              'import android.content.SharedPreferences;',
              'import android.content.res.AssetManager;',
              'import android.graphics.Color;',
              'import android.graphics.Typeface;',
              'import android.graphics.drawable.ColorDrawable;',
              'import android.graphics.drawable.GradientDrawable;',
              'import android.os.Build;',
              'import android.view.Gravity;',
              'import android.view.MotionEvent;',
              'import android.view.View;',
              'import android.view.ViewGroup;',
              'import android.view.ViewTreeObserver;',
              'import android.view.Window;',
              'import android.widget.ArrayAdapter;',
              'import android.widget.Button;',
              'import android.widget.EditText;',
              'import android.widget.FrameLayout;',
              'import android.widget.LinearLayout;',
              'import android.widget.ScrollView;',
              'import android.widget.Spinner;',
              'import android.widget.TextView;',
              'import android.widget.Toast;',
              'import org.json.JSONArray;',
              'import org.json.JSONObject;',
              'import java.io.BufferedReader;',
              'import java.io.File;',
              'import java.io.FileOutputStream;',
              'import java.io.FileReader;',
              'import java.io.FileWriter;',
              'import java.io.InputStream;',
              'import java.io.InputStreamReader;',
              'import java.io.OutputStream;',
              'import java.net.HttpURLConnection;',
              'import java.net.URL;',
              'import java.net.URLEncoder;',
              'import java.nio.charset.StandardCharsets;',
              'import java.util.UUID;',
              '',
              'public class NovaModMenu {',
              '    private static final String PREFS_NAME = "nova_launcher_m3_prefs";',
              '    public static volatile String lastXboxGamertag = null;',
              '    private static volatile Context appContext = null;',
              '',
              '    public static void attach(final Activity activity) {',
              '        if (activity == null) return;',
              '        appContext = activity.getApplicationContext();',
              '        activity.setTitle("NovaLauncher");',
              '        SharedPreferences prefs = activity.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);',
              '        String savedTag = prefs.getString("xbox_gamertag", null);',
              '        if (savedTag != null && !savedTag.isEmpty()) {',
              '            lastXboxGamertag = savedTag;',
              '        }',
              '        new Thread(new Runnable() {',
              '            @Override',
              '            public void run() {',
              '                sanitizeAccountsDir();',
              '                extractPreloadedVersions(activity, false);',
              '            }',
              '        }).start();',
              '        applyMaterial3Window(activity);',
              '        final View decor = activity.getWindow().getDecorView();',
              '        decor.post(new Runnable() {',
              '            @Override',
              '            public void run() {',
              '                applyMaterial3ViewTree(activity, decor);',
              '                attachFloatingBar(activity);',
              '            }',
              '        });',
              '        decor.getViewTreeObserver().addOnGlobalLayoutListener(new ViewTreeObserver.OnGlobalLayoutListener() {',
              '            @Override',
              '            public void onGlobalLayout() {',
              '                applyMaterial3ViewTree(activity, decor);',
              '            }',
              '        });',
              '    }',
              '',
              '    public static void captureXboxGamertag(String xblToken) {',
              '        if (xblToken == null || xblToken.isEmpty()) return;',
              '        HttpURLConnection conn = null;',
              '        try {',
              '            URL url = new URL("https://xsts.auth.xboxlive.com/xsts/authorize");',
              '            conn = (HttpURLConnection) url.openConnection();',
              '            conn.setRequestMethod("POST");',
              '            conn.setConnectTimeout(15000);',
              '            conn.setReadTimeout(15000);',
              '            conn.setRequestProperty("Content-Type", "application/json");',
              '            conn.setRequestProperty("Accept", "application/json");',
              '            conn.setRequestProperty("x-xbl-contract-version", "1");',
              '            conn.setDoOutput(true);',
              '            JSONObject props = new JSONObject();',
              '            props.put("SandboxId", "RETAIL");',
              '            JSONArray userTokens = new JSONArray();',
              '            userTokens.put(xblToken);',
              '            props.put("UserTokens", userTokens);',
              '            JSONObject payload = new JSONObject();',
              '            payload.put("Properties", props);',
              '            payload.put("RelyingParty", "http://xboxlive.com");',
              '            payload.put("TokenType", "JWT");',
              '            byte[] body = payload.toString().getBytes(StandardCharsets.UTF_8);',
              '            OutputStream os = conn.getOutputStream();',
              '            os.write(body);',
              '            os.close();',
              '            if (conn.getResponseCode() >= 200 && conn.getResponseCode() < 300) {',
              '                BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream(), StandardCharsets.UTF_8));',
              '                StringBuilder sb = new StringBuilder();',
              '                String line;',
              '                while ((line = br.readLine()) != null) sb.append(line);',
              '                br.close();',
              '                JSONObject resp = new JSONObject(sb.toString());',
              '                JSONObject claims = resp.optJSONObject("DisplayClaims");',
              '                if (claims != null) {',
              '                    JSONArray xui = claims.optJSONArray("xui");',
              '                    if (xui != null && xui.length() > 0) {',
              '                        JSONObject first = xui.getJSONObject(0);',
              '                        String gtg = first.optString("gtg", "");',
              '                        if (gtg.isEmpty()) gtg = first.optString("mgt", "");',
              '                        if (!gtg.isEmpty()) {',
              '                            lastXboxGamertag = gtg;',
              '                            if (appContext != null) {',
              '                                appContext.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)',
              '                                        .edit().putString("xbox_gamertag", gtg).apply();',
              '                            }',
              '                            sanitizeAccountsDir();',
              '                        }',
              '                    }',
              '                }',
              '            }',
              '        } catch (Throwable ignored) {',
              '        } finally {',
              '            if (conn != null) conn.disconnect();',
              '        }',
              '    }',
              '',
              '    public static String getResolvedGamertag() {',
              '        if (lastXboxGamertag != null && !lastXboxGamertag.isEmpty() && !lastXboxGamertag.equalsIgnoreCase("Player")) {',
              '            return lastXboxGamertag;',
              '        }',
              '        if (appContext != null) {',
              '            String saved = appContext.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).getString("xbox_gamertag", null);',
              '            if (saved != null && !saved.isEmpty() && !saved.equalsIgnoreCase("Player")) {',
              '                return saved;',
              '            }',
              '        }',
              '        return "BedrockPlayer";',
              '    }',
              '',
              '    public static void sanitizeAccountsDir() {',
              '        try {',
              '            if (appContext == null) return;',
              '            File accDir = new File(appContext.getFilesDir(), "accounts");',
              '            if (!accDir.exists()) return;',
              '            File[] files = accDir.listFiles();',
              '            if (files == null) return;',
              '            String realTag = getResolvedGamertag();',
              '            for (File f : files) {',
              '                if (!f.getName().endsWith(".json")) continue;',
              '                if (f.getName().equalsIgnoreCase("NovaPlayer.json")) {',
              '                    f.delete();',
              '                    continue;',
              '                }',
              '                BufferedReader br = new BufferedReader(new FileReader(f));',
              '                StringBuilder sb = new StringBuilder();',
              '                String l;',
              '                while ((l = br.readLine()) != null) sb.append(l);',
              '                br.close();',
              '                JSONObject obj = new JSONObject(sb.toString());',
              '                String uname = obj.optString("username", "");',
              '                if (uname.equalsIgnoreCase("Player") || uname.toLowerCase().contains("demo") || uname.equalsIgnoreCase("NovaPlayer")) {',
              '                    if (!realTag.equals("BedrockPlayer")) {',
              '                        obj.put("username", realTag);',
              '                        obj.put("profileId", UUID.nameUUIDFromBytes(("OfflinePlayer:" + realTag).getBytes()).toString().replace("-", ""));',
              '                        File newFile = new File(accDir, realTag + ".json");',
              '                        FileWriter fw = new FileWriter(newFile, false);',
              '                        fw.write(obj.toString(2));',
              '                        fw.close();',
              '                        if (!f.getName().equals(newFile.getName())) f.delete();',
              '                    } else {',
              '                        f.delete();',
              '                    }',
              '                }',
              '            }',
              '        } catch (Throwable ignored) {}',
              '    }',
              '',
              '    private static void applyMaterial3Window(Activity activity) {',
              '        try {',
              '            Window w = activity.getWindow();',
              '            w.setBackgroundDrawable(new ColorDrawable(Color.parseColor("#090D16")));',
              '            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {',
              '                w.setStatusBarColor(Color.parseColor("#060911"));',
              '                w.setNavigationBarColor(Color.parseColor("#090D16"));',
              '            }',
              '        } catch (Throwable ignored) {}',
              '    }',
              '',
              '    private static void applyMaterial3ViewTree(Activity activity, View root) {',
              '        if (root == null) return;',
              '        try {',
              '            if (root.getTag() != null && root.getTag().toString().startsWith("NOVA_")) return;',
              '            if (root instanceof TextView) {',
              '                TextView tv = (TextView) root;',
              '                CharSequence cs = tv.getText();',
              '                if (cs != null) {',
              '                    String s = cs.toString();',
              '                    if (s.contains("Amethyst (Debug)") || s.contains("Amethyst Debug") || s.equals("Amethyst") || s.equals("PojavLauncher")) {',
              '                        tv.setText("NovaLauncher");',
              '                    } else if (s.equalsIgnoreCase("Player") || s.equalsIgnoreCase("Demo Player")) {',
              '                        String real = getResolvedGamertag();',
              '                        if (!real.equals("BedrockPlayer")) tv.setText(real);',
              '                    }',
              '                }',
              '            }',
              '            if (root instanceof Button) {',
              '                Button btn = (Button) root;',
              '                String label = btn.getText() != null ? btn.getText().toString().toLowerCase() : "";',
              '                GradientDrawable gd = new GradientDrawable();',
              '                gd.setCornerRadius(dp(activity, 22));',
              '                if (label.contains("play") || label.contains("launch") || btn.getClass().getSimpleName().contains("MineButton")) {',
              '                    gd.setColor(Color.parseColor("#6366F1"));',
              '                    gd.setStroke(dp(activity, 1), Color.parseColor("#818CF8"));',
              '                    btn.setTextColor(Color.WHITE);',
              '                } else {',
              '                    gd.setColor(Color.parseColor("#1E293B"));',
              '                    gd.setStroke(dp(activity, 1), Color.parseColor("#334155"));',
              '                    btn.setTextColor(Color.parseColor("#F1F5F9"));',
              '                }',
              '                btn.setBackground(gd);',
              '                btn.setAllCaps(false);',
              '            } else if (root instanceof EditText) {',
              '                EditText et = (EditText) root;',
              '                GradientDrawable gd = new GradientDrawable();',
              '                gd.setCornerRadius(dp(activity, 16));',
              '                gd.setColor(Color.parseColor("#0F172A"));',
