              '    public static void extractPreloadedVersions(final Activity activity, final boolean notify) {',
              '        try {',
              '            AssetManager am = activity.getAssets();',
              '            String[] vers = am.list("novacraft_versions");',
              '            if (vers == null || vers.length == 0) return;',
              '            File versionsDir = new File(getGameDir(activity), "versions");',
              '            for (String vid : vers) {',
              '                File targetVerDir = new File(versionsDir, vid);',
              '                if (!targetVerDir.exists()) targetVerDir.mkdirs();',
              '                String[] files = am.list("novacraft_versions/" + vid);',
              '                if (files == null) continue;',
              '                for (String fn : files) {',
              '                    File outFile = new File(targetVerDir, fn);',
              '                    if (!outFile.exists() || outFile.length() == 0 || notify) {',
              '                        InputStream is = am.open("novacraft_versions/" + vid + "/" + fn);',
              '                        FileOutputStream fos = new FileOutputStream(outFile);',
              '                        byte[] buf = new byte[8192];',
              '                        int r;',
              '                        while ((r = is.read(buf)) != -1) fos.write(buf, 0, r);',
              '                        fos.close();',
              '                        is.close();',
              '                    }',
              '                }',
              '            }',
              '        } catch (Throwable ignored) {}',
              '    }',
              '',
              '    private static int dp(Context ctx, int v) {',
              '        return (int) (v * ctx.getResources().getDisplayMetrics().density);',
              '    }',
              '}'
          ]
          with open(nova_mod_menu_path, "w", encoding="utf-8") as fp:
              fp.write("\n".join(nova_lines))

          for act_name in ("LauncherActivity.java", "MainActivity.java", "TestStorageActivity.java"):
              for root, _, files in os.walk(java_root):
                  if act_name in files:
                      p = os.path.join(root, act_name)
                      with open(p, "r", encoding="utf-8", errors="ignore") as fp:
                          act_txt = fp.read()
                      if "NovaModMenu.attach(this);" not in act_txt:
                          act_txt = re.sub(
                              r"(super\.onCreate\s*\([^)]*\)\s*;)",
                              r"\1\n        net.kdt.pojavlaunch.NovaModMenu.attach(this);",
                              act_txt,
                              count=1
                          )
                          with open(p, "w", encoding="utf-8") as fp:
                              fp.write(act_txt)
                          print(f"Hooked NovaModMenu into {act_name}")
          EOF

      - name: Build GLFW stub
        working-directory: launcher
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          ./gradlew --no-daemon :jre_lwjgl3glfw:build

      - name: Build debug APK
        working-directory: launcher
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          ./gradlew --no-daemon :app_pojavlauncher:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCraft-debug-apk
          path: launcher/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
